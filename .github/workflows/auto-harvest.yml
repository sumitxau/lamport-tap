name: Auto Devnet SOL Harvester

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  harvest-sol:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger LamportTap cron airdrop
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://lamport-tap.vercel.app/api/airdrop/cron